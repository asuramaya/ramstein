name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Python compiles
        run: python3 -m py_compile src/bin/ramsteind src/bin/ramstein src/bin/ramstein-healthcheck src/bin/ramstein-update src/bin/sutra.py src/bin/sutra_update.py src/bin/sutra_xen.py

      - name: Extension JS compiles
        run: node --check "src/extension/ramstein@asuramaya/extension.js" "src/extension/ramstein@asuramaya/pill.js"

      - name: Shell scripts parse
        run: bash -n install.sh uninstall.sh packaging/release-signing/sync-signers.sh tests/smoke.sh

      - name: Shellcheck
        run: shellcheck install.sh uninstall.sh packaging/release-signing/sync-signers.sh tests/smoke.sh

      - name: check-sutra (vendored copy integrity)
        run: make check-sutra

      - name: Smoke (real daemon, real /proc, hostile socket input)
        run: make smoke

      - name: Attack (full cmd surface + oversized/garbage/invalid-utf8/nested/unknown/rapid-reconnect/half-open-stall)
        run: make attack

      - name: Man pages render without warnings
        run: |
          groff -man -Tutf8 -ww src/data/man/man1/ramstein.1 > /dev/null
          groff -t -man -Tutf8 -ww src/data/man/man8/ramsteind.8 > /dev/null

      - name: Repo structure gate (REPO-STANDARD.md)
        run: make check-repo

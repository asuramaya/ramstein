name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The family's shared CI core (sutra.mk's sibling layer — see
  # docs/BOOTSTRAP.md). Pinned to a commit SHA, not @main and not a tag,
  # per pill-ci.yml's own header: sutra cuts no tagged release yet, and a
  # floating @main ref would move every adopting pill's CI the instant this
  # file changes, with no per-pill review step.
  #
  # 0.11.1 (msg 2783) folded the raw shellcheck step in here too, via
  # shellcheck-files — was a sibling-job step below, deleted now that
  # pill-ci.yml carries it as a real, parameterized step.
  shared:
    uses: asuramaya/sutra/.github/workflows/pill-ci.yml@149b553b75467813748165401706ce6b50ca44d6
    with:
      python-files: "src/bin/ramsteind src/bin/ramstein src/bin/ramstein-healthcheck src/bin/ramstein-update src/share/ramstein/lib/sutra.py src/share/ramstein/lib/sutra_update.py src/share/ramstein/lib/sutra_xen.py"
      shell-files: "install.sh uninstall.sh packaging/release-signing/sync-signers.sh tests/smoke.sh tests/test_signing.sh"
      shellcheck-files: "install.sh uninstall.sh packaging/release-signing/sync-signers.sh tests/smoke.sh tests/test_signing.sh"
      has-extension: true
      extension-js: "src/extension/ramstein@asuramaya/extension.js"
      extension-metadata: "src/extension/ramstein@asuramaya/metadata.json"
      man-pages: "src/data/man/man1/ramstein.1 src/data/man/man8/ramsteind.8"
      # run-attack defaults to false in pill-ci.yml; the original hand-written
      # ci.yml always ran the adversarial fuzz pass and the very first pilot
      # adoption (commit 7e6c637) silently dropped it by never setting this --
      # missed for two full report cycles since `make attack` still passed
      # locally every time, just never ran in CI. Caught only by reading the
      # ACTUAL step list off a real run (gh api .../jobs/<id> steps[].status),
      # not by the green checkmark alone.
      run-attack: true
      # ramstein has no per-file VERSION constant to check: Pass 2 (RS-STD-1)
      # deliberately removed the old per-binary literal in favor of a single
      # packaging/VERSION source of truth, read live at runtime — the exact
      # opposite of the per-file-version-constant convention check-version.sh
      # enforces upstream, and check-repo's own "no literal version string
      # outside packaging/VERSION" rule holds the line on it. This is also
      # now pill-ci.yml's own default (msg 2783) — kept explicit here so the
      # reason stays on record rather than riding on an upstream default.
      run-check-version: false
      # run-signing-verify stays at its default (false): test_signing.sh is
      # already covered by run-smoke — make smoke's own recipe runs it
      # (DM #2913) — running it a second time here would be redundant.

  # Genuinely pill-specific, per pill-ci.yml's own header ("stays as a
  # sibling job in the calling pill's own ci.yml"). pill.js's own
  # integrity/freshness folded into check-sutra itself at 0.11.1
  # (SUTRA_EXT_DIR, set in the Makefile) and shellcheck moved into the
  # shared job above, so this now covers exactly one thing sutra.mk still
  # can't: the checkout-run resolution check across all four binaries that
  # carry the bootstrap preamble. sutra.mk's check-vendored-path validates
  # one SUTRA_CHECK_BIN per invocation; check-vendored-path-all (native as
  # of 0.11.1, driven by the Makefile's SUTRA_CHECK_BINS list) loops it.
  ramstein-specific:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Vendored-path resolution (all four binaries)
        run: make check-vendored-path-all

  # Found 2026-08-02 (alfred, diffing the published v0.11.1 .deb against its
  # own unit files): every pill in this family ships a hardened systemd
  # unit and none had ever actually STARTED one in a test — CI always ran
  # the raw binary directly. ramstein's .deb shipped ExecStart=/usr/local/
  # bin/... (install.sh's prefix) while installing binaries to /usr/bin
  # (fixed in the deb: target, this same commit): dpkg succeeded, the
  # daemon died 203/EXEC, postinst's `|| true` swallowed it silently.
  # Undetectable from a raw-binary test no matter how thorough, since the
  # raw binary never goes near the unit file — only installing the actual
  # .deb and starting the actual unit exercises that path. GitHub's
  # ubuntu-latest runners are full VMs with systemd as PID 1 (not
  # containers), unlike a sandboxed dev environment, so this can run for
  # real rather than assume the hardening/paths are correct on paper.
  #
  # The actual check lives in Makefile's check-systemd-live target, not
  # here — family doctrine (commit 2efd0eb): ci.yml invokes Makefile
  # targets rather than carrying a copy CI alone knows about, so the exact
  # same check reproduces locally in the systemd container harness (jrei/
  # systemd-ubuntu:24.04, --cgroupns=host), not just on a GitHub runner.
  # Reconciled with ByeByte's own version of this check, joint findings
  # 2026-08-02: the daemon poll window (30s), the per-property systemctl
  # show style, $(DEBFILE) over a glob, and the two-halves timer-resolution
  # split (systemd-analyze verify's OUTPUT, not its exit code, plus a real
  # systemctl start) are all the same shape in both pills now.
  systemd-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the .deb
        run: make deb

      - name: Install for real and poll all shipped units to completion
        run: sudo make check-systemd-live

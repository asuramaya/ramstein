name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches VERSION and ramsteind's internal constant
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          daemon="$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' bin/ramsteind)"
          echo "tag=${tag} VERSION=${file} bin/ramsteind=${daemon}"
          if [ "${tag}" != "${file}" ]; then
            echo "::error::tag ${tag} does not match VERSION ${file}"
            exit 1
          fi
          if [ "${file}" != "${daemon}" ]; then
            echo "::error::VERSION ${file} does not match bin/ramsteind's own VERSION ${daemon}"
            exit 1
          fi

      - name: Build .deb (produces build/deb/ramstein_<ver>_all.deb + SHA256SUMS)
        run: make deb

      - name: Build release tarball, fold into the same manifest
        run: |
          # .gitattributes export-ignore keeps CI/dev files out of the tarball.
          # --prefix=ramstein/: every tarball extracts to exactly one named
          # directory, never bare into the caller's CWD.
          git archive --format=tar.gz --prefix=ramstein/ -o ramstein.tar.gz HEAD
          debfile="build/deb/ramstein_$(tr -d '[:space:]' < VERSION)_all.deb"
          cp "${debfile}" .
          cp build/deb/SHA256SUMS .
          sha256sum ramstein.tar.gz >> SHA256SUMS
          echo "--- contents (tarball) ---"
          tar -tzf ramstein.tar.gz
          echo "--- manifest (one signature covers every artifact it lists) ---"
          cat SHA256SUMS

      - name: Extract release notes from CHANGELOG
        run: |
          # Format-agnostic: grabs the section starting at the first `## `
          # heading whose text contains the tag's version, up to (not
          # including) the next `## ` heading.
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" 'BEGIN{f=0} /^## / { if(f) exit; if(index($0,v)){f=1;print;next} } f{print}' CHANGELOG.md > RELEASE_NOTES.md
          echo "--- extracted release notes ($(wc -l < RELEASE_NOTES.md) lines) ---"
          cat RELEASE_NOTES.md

      # No signing step here, deliberately: ramstein-update and (once RAMstein
      # gains a verified-release bootstrap) install.sh trust an SSH signature
      # (ssh-keygen -Y verify) against a key pinned INSIDE the client
      # (release-signing/allowed_signers, docs/RELEASE-SIGNING.md), precisely
      # so this CI (or the GitHub account behind it) is not the trust root. A
      # secret/hardware key living in Actions secrets would let anyone who
      # compromises the account or the workflow sign whatever they just
      # pushed — that defeats the entire scheme. The release ships UNSIGNED
      # from here; the operator signs the published SHA256SUMS bytes BY HAND,
      # offline, with the physical FIDO2 key, and runs `gh release upload
      # <tag> SHA256SUMS.sig --clobber` after.

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Unsigned assets only. Verifiers fail closed until the operator
          # uploads a detached signature out of band (see comment above).
          debfile="build/deb/ramstein_$(tr -d '[:space:]' < VERSION)_all.deb"
          assets=("$(basename "${debfile}")" ramstein.tar.gz SHA256SUMS)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            # Prefer the extracted CHANGELOG section; fall back to GitHub's
            # auto-generated notes if extraction came up empty/too-thin
            # (e.g. a version bump with no matching heading).
            if [ "$(wc -l < RELEASE_NOTES.md)" -ge 2 ]; then
              notes_flag=(--notes-file RELEASE_NOTES.md)
            else
              notes_flag=(--generate-notes)
            fi
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --title "ramstein ${GITHUB_REF_NAME}" \
              "${notes_flag[@]}"
          fi
